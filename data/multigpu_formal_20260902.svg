<text x="80.0" y="330.0" font-size="12px" text-anchor="end" fill="#202124">2.6s</text>
<line x1="90" y1="260.0" x2="945" y2="260.0" stroke="#e5e7eb"/>
<text x="80.0" y="265.0" font-size="12px" text-anchor="end" fill="#202124">5.1s</text>
